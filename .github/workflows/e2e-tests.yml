name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Each workflow run gets its own ephemeral Neon branch (child of the
      # shared "test" branch, so it inherits its Prisma migration history
      # and needs no P3005 baseline step). This replaces the old setup of
      # every run sharing one static TEST_DATABASE_URL/TEST_DIRECT_URL
      # database, which relied on tests/global-setup.ts deleting rows by
      # name convention for isolation and caused cross-run flakiness when
      # multiple PRs' suites ran concurrently.
      - name: Create Neon test branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail

          BRANCH_NAME="ci/e2e-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Creating ephemeral Neon branch: $BRANCH_NAME"

          PARENT_BRANCH_ID=$(curl -s "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" | \
            jq -r '.branches[] | select(.name == "test") | .id')

          if [ -z "$PARENT_BRANCH_ID" ] || [ "$PARENT_BRANCH_ID" == "null" ]; then
            echo "✗ Could not find a Neon branch named 'test' in project $NEON_PROJECT_ID to branch from"
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"branch\": {\"parent_id\": \"$PARENT_BRANCH_ID\", \"name\": \"$BRANCH_NAME\"}, \"endpoints\": [{\"type\": \"read_write\"}]}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "✗ Failed to create database branch. HTTP status: $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          BRANCH_ID=$(echo "$BODY" | jq -r '.branch.id')
          DIRECT_URL=$(echo "$BODY" | jq -r '.connection_uris[0].connection_uri // empty')
          POOLER_HOST=$(echo "$BODY" | jq -r '.connection_uris[0].connection_parameters.pooler_host // empty')

          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" == "null" ] || [ -z "$DIRECT_URL" ]; then
            echo "✗ Unexpected response creating database branch"
            echo "$BODY"
            exit 1
          fi

          # Prefer the pooled (pgbouncer) host for app traffic, same
          # substitution scripts/neon-branch.ts does for local dev branches.
          POOLED_URL="$DIRECT_URL"
          if [ -n "$POOLER_HOST" ]; then
            POOLER_SUBDOMAIN=$(echo "$POOLER_HOST" | cut -d. -f1)
            POOLED_URL=$(echo "$DIRECT_URL" | sed -E "s/ep-[^.]+\./${POOLER_SUBDOMAIN}./")
          fi

          # Mask before these ever hit a log line or $GITHUB_ENV
          echo "::add-mask::$DIRECT_URL"
          echo "::add-mask::$POOLED_URL"

          echo "NEON_BRANCH_ID=$BRANCH_ID" >> "$GITHUB_ENV"
          echo "NEON_BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "NEON_BRANCH_DIRECT_URL=$DIRECT_URL" >> "$GITHUB_ENV"
          echo "NEON_BRANCH_DATABASE_URL=$POOLED_URL" >> "$GITHUB_ENV"

          echo "⏳ Waiting for branch compute endpoint to become ready..."
          STATE="unknown"
          for i in $(seq 1 30); do
            STATE=$(curl -s "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
              -H "Authorization: Bearer $NEON_API_KEY" \
              -H "Accept: application/json" | jq -r '.branch.current_state')
            if [ "$STATE" == "ready" ]; then
              break
            fi
            sleep 2
          done

          if [ "$STATE" != "ready" ]; then
            echo "✗ Branch '$BRANCH_NAME' did not become ready in time (last state: $STATE)"
            exit 1
          fi

          echo "✓ Created database branch '$BRANCH_NAME' ($BRANCH_ID)"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          # Keyed on the schema too, since node_modules bundles the
          # generated Prisma client - a schema-only change must still
          # bust the cache even if package-lock.json didn't move.
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          DATABASE_URL: ${{ env.NEON_BRANCH_DATABASE_URL }}

      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        # Browser binaries are cached, but the runner VM itself is fresh
        # each run, so the underlying apt packages still need installing.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.NEON_BRANCH_DATABASE_URL }}
          DIRECT_URL: ${{ env.NEON_BRANCH_DIRECT_URL }}

      - name: Run E2E tests
        run: npm test
        env:
          CI: true
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Skip the real Resend send in the registration e2e test (reads the
          # verification token from the DB instead) so routine CI/PR runs
          # don't burn the daily Resend quota. The scheduled
          # e2e-email-smoke.yml workflow runs without this flag to verify
          # the real Resend integration still works.
          SKIP_EMAIL_SEND: "true"
          # Playwright config will override DATABASE_URL with TEST_DATABASE_URL
          TEST_DATABASE_URL: ${{ env.NEON_BRANCH_DATABASE_URL }}
          DIRECT_URL: ${{ env.NEON_BRANCH_DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}

      - name: Upload Playwright report and test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          compression-level: 9

      - name: Delete Neon test branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -uo pipefail

          BRANCH_ID="${NEON_BRANCH_ID:-}"

          if [ -z "$BRANCH_ID" ]; then
            echo "No database branch was created for this run - nothing to clean up"
            exit 0
          fi

          # Safety check: don't trust the $NEON_BRANCH_NAME env var carried
          # over from the create step - look up what Neon currently has
          # this branch ID named, and only delete if that name is one of
          # ours. This guards against deleting a protected/shared branch
          # even if $NEON_BRANCH_ID ended up pointing at the wrong branch.
          BRANCH_NAME=$(curl -s "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" | jq -r '.branch.name // empty')

          if [ -z "$BRANCH_NAME" ]; then
            echo "⚠️  SAFETY CHECK: Could not look up branch $BRANCH_ID by ID - skipping deletion for safety."
            exit 0
          fi

          PROTECTED_BRANCHES=("main" "dev" "test" "production" "staging")
          for protected in "${PROTECTED_BRANCHES[@]}"; do
            if [ "$BRANCH_NAME" == "$protected" ]; then
              echo "⚠️  SAFETY CHECK: Cannot delete protected branch: $protected"
              echo "Skipping deletion for safety."
              exit 0
            fi
          done

          if [[ "$BRANCH_NAME" != ci/e2e-* ]]; then
            echo "⚠️  SAFETY CHECK: Branch $BRANCH_ID is named '$BRANCH_NAME', not a ci/e2e-* branch this workflow created."
            echo "Skipping deletion for safety."
            exit 0
          fi

          echo "Deleting ephemeral database branch: $BRANCH_NAME ($BRANCH_ID)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "204" ]; then
            echo "✓ Successfully deleted database branch: $BRANCH_NAME"
          else
            echo "✗ Failed to delete database branch. HTTP status: $HTTP_CODE"
            echo "Response: $BODY"
            # Don't fail the job over cleanup - the weekly orphaned-branch
            # cleanup workflow will catch anything left behind.
            exit 0
          fi

  lint-typecheck-build:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        env:
          # Use TEST_DATABASE_URL in CI to avoid touching production
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # This job's build runs `prisma migrate deploy` against the shared
        # TEST_DATABASE_URL (the `test` job now migrates its own ephemeral
        # Neon branch instead, so it no longer races this). A concurrent run
        # of this same job (e.g. another PR's push) could still contend for
        # Prisma's migration advisory lock (P1002), so retry rather than add
        # a `needs:` dependency that would slow down feedback.
        run: |
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            echo "Build attempt $attempt failed (possibly a migration advisory-lock race with the test job) — retrying in 10s..." >&2
            sleep 10
          done
          exit 1
        env:
          # Build runs `prisma migrate deploy` internally, so it needs a real DB.
          # Use TEST_DATABASE_URL/TEST_DIRECT_URL in CI to avoid touching production
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          # next build evaluates route modules while collecting page data, and
          # src/app/api/inbound-email/route.ts constructs a Resend client at
          # module scope, which throws if this is unset
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
