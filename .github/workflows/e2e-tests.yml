name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # Use TEST_DATABASE_URL in CI to avoid touching production
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # Always run --with-deps: OS-level apt packages aren't part of the
        # cached ms-playwright directory, so they must be (re)installed every
        # run. When the cache above hits, Playwright detects the chromium
        # binary is already present at this version and skips the download,
        # so this step only pays for the apt-get portion.
        run: npx playwright install --with-deps chromium

      - name: Setup database
        run: npx prisma migrate deploy
        env:
          # Use TEST_DATABASE_URL in CI to avoid touching production
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Run E2E tests
        run: npm test
        env:
          CI: true
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Playwright config will override DATABASE_URL with TEST_DATABASE_URL
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}

      - name: Upload Playwright report and test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          compression-level: 9
