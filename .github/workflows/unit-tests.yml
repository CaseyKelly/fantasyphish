name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Vite (a Vitest dependency) requires node ^20.19.0 || >=22.12.0;
          # pin to an exact patch (kept current by Renovate) instead of just
          # the "24" major so CI doesn't silently drift onto an incompatible patch.
          node-version: "24.19.0"
          cache: "npm"

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          # node-version-pinned suffix so this never shares a cache entry with
          # e2e-tests.yml's floating "24" version if the two ever diverge
          key: node-modules-${{ runner.os }}-node24.19.0-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
