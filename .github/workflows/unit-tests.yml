name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite (a Vitest dependency) requires node ^20.19.0 || >=22.12.0;
          # pin to a compatible 20.x minor instead of the "20" major alone
          # so CI doesn't silently drift onto an incompatible earlier patch.
          node-version: "20.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
