name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Vite (a Vitest dependency) requires node ^20.19.0 || >=22.12.0;
          # pin to an exact patch (kept current by Renovate) instead of just
          # the "24" major so CI doesn't silently drift onto an incompatible patch.
          node-version: "24.19.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
