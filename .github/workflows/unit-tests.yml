name: Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup mise (Node.js)
        uses: jdx/mise-action@v4
        # Node version comes from mise.toml (kept current by Renovate), so
        # this workflow and local/agent dev can never drift apart.

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          # Keyed on mise.toml (not a hardcoded Node version string) so a
          # Renovate-driven Node bump automatically busts this cache instead
          # of silently reusing node_modules built against a different patch
          key: node-modules-${{ runner.os }}-${{ hashFiles('mise.toml', 'package-lock.json', 'prisma/schema.prisma') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit
