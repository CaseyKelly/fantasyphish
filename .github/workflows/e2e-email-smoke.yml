name: Email Smoke Test

# Runs only the registration test that sends a real verification email
# through Resend, so we notice if the Resend integration itself breaks.
# Routine e2e-tests.yml runs set SKIP_EMAIL_SEND=true and never touch
# Resend, so this is the only thing exercising the real send path -
# scheduled (rather than on every PR) to stay well within Resend's daily
# send quota. GitHub notifies watchers by email when a scheduled workflow
# run fails, so a broken integration surfaces without extra alerting setup.

on:
  schedule:
    - cron: "0 13 * * *" # Daily at 13:00 UTC
  workflow_dispatch: {} # Allow manual runs from the Actions tab

jobs:
  email-smoke:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Same ephemeral-Neon-branch approach as e2e-tests.yml, so this run
      # never touches the shared test database or production.
      - name: Create Neon test branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail

          BRANCH_NAME="ci/e2e-email-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Creating ephemeral Neon branch: $BRANCH_NAME"

          PARENT_BRANCH_ID=$(curl -s "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" | \
            jq -r '.branches[] | select(.name == "test") | .id')

          if [ -z "$PARENT_BRANCH_ID" ] || [ "$PARENT_BRANCH_ID" == "null" ]; then
            echo "✗ Could not find a Neon branch named 'test' in project $NEON_PROJECT_ID to branch from"
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"branch\": {\"parent_id\": \"$PARENT_BRANCH_ID\", \"name\": \"$BRANCH_NAME\"}, \"endpoints\": [{\"type\": \"read_write\"}]}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "✗ Failed to create database branch. HTTP status: $HTTP_CODE"
            echo "$BODY"
            exit 1
          fi

          BRANCH_ID=$(echo "$BODY" | jq -r '.branch.id')
          DIRECT_URL=$(echo "$BODY" | jq -r '.connection_uris[0].connection_uri // empty')
          POOLER_HOST=$(echo "$BODY" | jq -r '.connection_uris[0].connection_parameters.pooler_host // empty')

          if [ -z "$BRANCH_ID" ] || [ "$BRANCH_ID" == "null" ] || [ -z "$DIRECT_URL" ]; then
            echo "✗ Unexpected response creating database branch"
            echo "$BODY"
            exit 1
          fi

          POOLED_URL="$DIRECT_URL"
          if [ -n "$POOLER_HOST" ]; then
            POOLER_SUBDOMAIN=$(echo "$POOLER_HOST" | cut -d. -f1)
            POOLED_URL=$(echo "$DIRECT_URL" | sed -E "s/ep-[^.]+\./${POOLER_SUBDOMAIN}./")
          fi

          echo "::add-mask::$DIRECT_URL"
          echo "::add-mask::$POOLED_URL"

          echo "NEON_BRANCH_ID=$BRANCH_ID" >> "$GITHUB_ENV"
          echo "NEON_BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "NEON_BRANCH_DIRECT_URL=$DIRECT_URL" >> "$GITHUB_ENV"
          echo "NEON_BRANCH_DATABASE_URL=$POOLED_URL" >> "$GITHUB_ENV"

          echo "⏳ Waiting for branch compute endpoint to become ready..."
          STATE="unknown"
          for i in $(seq 1 30); do
            STATE=$(curl -s "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
              -H "Authorization: Bearer $NEON_API_KEY" \
              -H "Accept: application/json" | jq -r '.branch.current_state')
            if [ "$STATE" == "ready" ]; then
              break
            fi
            sleep 2
          done

          if [ "$STATE" != "ready" ]; then
            echo "✗ Branch '$BRANCH_NAME' did not become ready in time (last state: $STATE)"
            exit 1
          fi

          echo "✓ Created database branch '$BRANCH_NAME' ($BRANCH_ID)"

      - name: Setup mise (Node.js)
        uses: jdx/mise-action@v4
        # Node version comes from mise.toml (kept current by Renovate), so
        # this workflow and local/agent dev can never drift apart.

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ env.NEON_BRANCH_DATABASE_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.NEON_BRANCH_DATABASE_URL }}
          DIRECT_URL: ${{ env.NEON_BRANCH_DIRECT_URL }}

      - name: Run registration email smoke test
        run: npm test -- -g "full registration flow"
        env:
          CI: true
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Deliberately unset - this is the one run that should hit the
          # real Resend API instead of reading the token from the DB.
          TEST_DATABASE_URL: ${{ env.NEON_BRANCH_DATABASE_URL }}
          DIRECT_URL: ${{ env.NEON_BRANCH_DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          PHISHNET_API_KEY: ${{ secrets.PHISHNET_API_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: email-smoke-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 1
          compression-level: 9

      - name: Delete Neon test branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -uo pipefail

          BRANCH_ID="${NEON_BRANCH_ID:-}"

          if [ -z "$BRANCH_ID" ]; then
            echo "No database branch was created for this run - nothing to clean up"
            exit 0
          fi

          BRANCH_NAME=$(curl -s "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json" | jq -r '.branch.name // empty')

          if [ -z "$BRANCH_NAME" ]; then
            echo "⚠️  SAFETY CHECK: Could not look up branch $BRANCH_ID by ID - skipping deletion for safety."
            exit 0
          fi

          PROTECTED_BRANCHES=("main" "dev" "test" "production" "staging")
          for protected in "${PROTECTED_BRANCHES[@]}"; do
            if [ "$BRANCH_NAME" == "$protected" ]; then
              echo "⚠️  SAFETY CHECK: Cannot delete protected branch: $protected"
              echo "Skipping deletion for safety."
              exit 0
            fi
          done

          if [[ "$BRANCH_NAME" != ci/e2e-email-smoke-* ]]; then
            echo "⚠️  SAFETY CHECK: Branch $BRANCH_ID is named '$BRANCH_NAME', not a ci/e2e-email-smoke-* branch this workflow created."
            echo "Skipping deletion for safety."
            exit 0
          fi

          echo "Deleting ephemeral database branch: $BRANCH_NAME ($BRANCH_ID)"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Accept: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "204" ]; then
            echo "✓ Successfully deleted database branch: $BRANCH_NAME"
          else
            echo "✗ Failed to delete database branch. HTTP status: $HTTP_CODE"
            echo "Response: $BODY"
            exit 0
          fi
