name: Claude Code Review

# Runs this repo's own /code-review skill against every PR and posts findings
# as inline PR comments, via https://github.com/anthropics/claude-code-action.
#
# Authenticates to the Claude API with workload identity federation: the
# action exchanges this workflow's GitHub OIDC token for a short-lived
# Anthropic token, so no API key is stored in the repo. The IDs below aren't
# secrets - the federation rule in the Claude Console decides which repos and
# workflows may use them. See .github/GITHUB_ACTIONS_SETUP.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Required for workload identity federation (and for claude-code-action to
  # mint its GitHub token) - the OIDC token is what gets exchanged.
  id-token: write

jobs:
  review:
    # Fork PRs don't get an OIDC token, so federation can't authenticate them -
    # skip rather than fail. Bot-authored PRs (Renovate) are skipped too:
    # claude-code-action refuses non-human actors and fails the job, and the
    # /code-review skill treats dependency bumps as a non-goal anyway.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run /code-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01TmCaWaq9mVwfpiZPfw4yGT
          anthropic_organization_id: 0bcba049-4ac3-4743-8b46-9a5f1577d730
          anthropic_service_account_id: svac_01AbVedmnFRZEjUrRLhfGtgi
          anthropic_workspace_id: wrkspc_01Ey3dq8jZjJ6ztsTw3rLwJT
          # medium: fewer, high-confidence findings - tuned for unattended
          # per-PR runs so this doesn't flood every PR with low-confidence
          # noise. --comment posts findings as inline PR review comments
          # instead of just replying in chat.
          prompt: "/code-review medium --comment"
